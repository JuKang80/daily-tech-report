<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Tech Report — GitHub Trending &amp; GeekNews</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>날짜</h2>
      <ul id="date-list" class="date-list">
        <li class="meta">불러오는 중...</li>
      </ul>
    </aside>

    <main>
      <div class="main-header">
        <h1 id="report-title">Daily Tech Report</h1>
        <span id="report-meta" class="meta">08:30 · 18:30 KST</span>
      </div>
      <div id="report-content">
        <p class="meta">리포트를 불러오는 중...</p>
      </div>
    </main>
  </div>

  <dialog id="item-modal" class="item-modal" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-badges">
          <span id="modal-rank" class="hn-rank"></span>
          <span id="modal-tag" class="hn-tag"></span>
        </div>
        <button type="button" id="modal-close" class="modal-icon-close" aria-label="닫기">✕</button>
      </div>
      <h3 id="modal-title" class="modal-title"></h3>
      <div class="modal-body">
        <p id="modal-desc" class="modal-desc"></p>
        <p id="modal-use" class="hn-use" hidden></p>
        <div id="modal-detail" class="hn-detail-body" hidden></div>
      </div>
      <div class="modal-footer">
        <a id="modal-link" class="modal-open-link" href="#" target="_blank" rel="noopener">원문 보러가기 ↗</a>
      </div>
    </div>
  </dialog>
</body>
</html>
