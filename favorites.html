<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>즐겨찾기 — Daily Tech Report</title>
  <meta name="description" content="나중에 참고할 GitHub Trending, GeekNews, AI/신경과학 논문 즐겨찾기 모음" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='28' font-weight='bold' fill='%2358a6ff'%3EDTR%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="style.css" />
  <script src="favorites.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar-nav" aria-label="페이지 이동">
        <a href="index.html" class="nav-link">
          <span>데일리 리포트</span>
        </a>
        <a href="favorites.html" class="nav-link active" aria-current="page">
          <span>★ 즐겨찾기</span>
          <span id="favorites-nav-count" class="nav-badge" hidden>0</span>
        </a>
      </nav>
      <h2>분류</h2>
      <div id="favorites-filters" class="fav-filters" role="group" aria-label="카테고리 필터">
        <button type="button" class="fav-filter-btn active" data-category="all" aria-pressed="true">전체</button>
        <button type="button" class="fav-filter-btn" data-category="github" aria-pressed="false">GitHub</button>
        <button type="button" class="fav-filter-btn" data-category="geeknews" aria-pressed="false">GeekNews</button>
        <button type="button" class="fav-filter-btn" data-category="paper" aria-pressed="false">논문</button>
      </div>
    </aside>

    <main>
      <div class="main-header">
        <h1>★ 즐겨찾기</h1>
        <span id="favorites-meta" class="meta">저장된 항목 0개</span>
      </div>

      <div class="fav-toolbar">
        <input
          type="search"
          id="favorites-search"
          class="fav-search"
          placeholder="제목, 태그, 설명, 활용 방안 검색..."
          aria-label="즐겨찾기 검색"
        />
        <div class="fav-toolbar-actions">
          <button type="button" id="favorites-export-btn" class="fav-action-btn" hidden>내보내기</button>
          <button type="button" id="favorites-import-btn" class="fav-action-btn">가져오기</button>
          <input type="file" id="favorites-import-input" accept="application/json,.json" hidden />
          <button type="button" id="favorites-clear-btn" class="fav-action-btn fav-clear-btn" hidden>전체 비우기</button>
        </div>
      </div>

      <div id="favorites-content">
        <p class="meta">즐겨찾기를 불러오는 중...</p>
      </div>
    </main>
  </div>

  <dialog id="item-modal" class="item-modal" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-badges">
          <span id="modal-rank" class="hn-rank"></span>
          <span id="modal-tag" class="hn-tag"></span>
        </div>
        <button type="button" id="modal-close" class="modal-icon-close" aria-label="닫기">✕</button>
      </div>
      <h3 id="modal-title" class="modal-title"></h3>
      <div class="modal-body">
        <p id="modal-desc" class="modal-desc"></p>
        <p id="modal-use" class="hn-use" hidden></p>
        <div id="modal-detail" class="hn-detail-body" hidden></div>
      </div>
      <div class="modal-footer">
        <button type="button" id="modal-fav-btn" class="modal-fav-btn" aria-pressed="false">☆ 즐겨찾기</button>
        <a id="modal-link" class="modal-open-link" href="#" target="_blank" rel="noopener">원문 보러가기 ↗</a>
      </div>
    </div>
  </dialog>
</body>
</html>
